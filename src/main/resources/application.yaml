spring:
  config:
    import: optional:file:./env.properties
  application:
    name: FinFlow
  datasource:
    url: ${APP_DATASOURCE_URL}
    username: ${APP_DATASOURCE_USERNAME}
    password: ${APP_DATASOURCE_PASSWORD}
    driver-class-name: ${APP_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${APP_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${APP_JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
  rabbitmq:
    host: ${APP_RABBITMQ_HOST}
    port: ${APP_RABBITMQ_PORT}
    username: ${APP_RABBITMQ_USERNAME}
    password: ${APP_RABBITMQ_PASSWORD}
  mail:
    host: ${APP_MAIL_HOST}
    port: ${APP_MAIL_PORT}
    username: ${APP_MAIL_USERNAME:}
    password: ${APP_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${APP_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${APP_MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${APP_MAIL_SMTP_STARTTLS_REQUIRED:false}
